<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>손 뻗기 모션 러너</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;color:#fff;font-family:Arial,sans-serif}
#game{position:fixed;inset:0;width:100%;height:100%;background:linear-gradient(#78c9ff 0%,#dff5ff 62%,#8bd36b 62%,#5ca84c 100%)}
#video{position:fixed;right:12px;top:12px;width:min(30vw,220px);aspect-ratio:4/3;object-fit:cover;border:3px solid #fff;border-radius:14px;transform:scaleX(-1);z-index:3;background:#222}
#hud{position:fixed;left:12px;top:12px;z-index:4;background:rgba(0,0,0,.55);padding:10px 14px;border-radius:12px;font-weight:bold;line-height:1.5}
#status{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:4;background:rgba(0,0,0,.65);padding:9px 15px;border-radius:999px;font-size:15px;white-space:nowrap}
#start{position:fixed;z-index:5;left:50%;top:50%;transform:translate(-50%,-50%);border:0;border-radius:18px;padding:18px 30px;font-size:22px;font-weight:bold;background:#111;color:#fff;box-shadow:0 8px 30px #0007}
#help{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:4;background:rgba(0,0,0,.62);padding:10px 14px;border-radius:12px;text-align:center;font-size:14px;line-height:1.5;white-space:nowrap}
#gameover{display:none;position:fixed;z-index:10;inset:0;background:rgba(0,0,0,.72);align-items:center;justify-content:center;text-align:center}
#gameover .box{background:#222;padding:28px;border-radius:20px;min-width:260px}
#restart{border:0;border-radius:12px;padding:12px 20px;font-weight:bold;font-size:18px}
@media(max-width:600px){
 #video{width:38vw;max-width:170px}
 #hud{font-size:13px}
 #help{font-size:12px;max-width:90vw;white-space:normal}
}
</style>
</head>
<body>
<canvas id="game"></canvas>
<video id="video" autoplay playsinline muted></video>

<div id="hud">
점수: <span id="score">0</span><br>
목숨: <span id="lives">3</span>
</div>
<div id="status">카메라를 준비하는 중...</div>
<div id="help">🖐️ 손을 화면 왼쪽으로 뻗기 = 왼쪽　|　오른쪽으로 뻗기 = 오른쪽<br>🙌 두 손을 위로 = 점프</div>

<button id="start">게임 시작</button>

<div id="gameover">
 <div class="box">
  <h1>GAME OVER</h1>
  <p>점수: <b id="finalScore">0</b></p>
  <button id="restart">다시 하기</button>
 </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>
<script>
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
const video=document.getElementById('video');
const scoreEl=document.getElementById('score');
const livesEl=document.getElementById('lives');
const statusEl=document.getElementById('status');
const startBtn=document.getElementById('start');
const gameoverEl=document.getElementById('gameover');
const finalScoreEl=document.getElementById('finalScore');
const restartBtn=document.getElementById('restart');

let W=innerWidth,H=innerHeight,dpr=Math.min(devicePixelRatio||1,2);
function resize(){
 W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);
 canvas.width=W*dpr;canvas.height=H*dpr;
 canvas.style.width=W+'px';canvas.style.height=H+'px';
 ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener('resize',resize);resize();

let pose=null,stream=null,poseReady=false,processing=false;
let running=false,gameOver=false,score=0,lives=3,lastTime=0;
let player={x:W/2,y:0,w:58,h:86,vy:0,onGround:true};
let obstacles=[];
let spawnTimer=0;
let control='center';
let controlCooldown=0;
let jumpCooldown=0;
let lastActionTime=0;

// MediaPipe Pose landmarks
const NOSE=0, LEFT_SHOULDER=11, RIGHT_SHOULDER=12,
      LEFT_WRIST=15, RIGHT_WRIST=16,
      LEFT_ELBOW=13, RIGHT_ELBOW=14,
      LEFT_HIP=23, RIGHT_HIP=24,
      LEFT_KNEE=25, RIGHT_KNEE=26;

function lmGood(p){return p && (p.visibility===undefined || p.visibility>0.45);}

function getPoseDirection(lm){
  const ls=lm[LEFT_SHOULDER], rs=lm[RIGHT_SHOULDER];
  const lw=lm[LEFT_WRIST], rw=lm[RIGHT_WRIST];
  if(!lmGood(ls)||!lmGood(rs)||!lmGood(lw)||!lmGood(rw)) return null;

  // 각 손목이 자기 어깨에서 얼마나 옆으로 떨어졌는지 계산.
  // 어느 손이든 화면 왼쪽으로 충분히 뻗으면 LEFT,
  // 오른쪽으로 충분히 뻗으면 RIGHT.
  const leftDelta=lw.x-ls.x;
  const rightDelta=rw.x-rs.x;

  // 어깨 너비를 기준으로 한 상대 거리라 사람과 카메라 거리가 달라도 대응.
  const shoulderWidth=Math.max(Math.abs(rs.x-ls.x),0.08);
  const threshold=Math.max(shoulderWidth*0.72,0.11);

  // 두 팔을 위로 들었는지
  const nose=lm[NOSE];
  const leftUp=lmGood(lw)&&lw.y < ls.y-threshold*0.55;
  const rightUp=lmGood(rw)&&rw.y < rs.y-threshold*0.55;

  if(leftUp && rightUp){
    const elbowsUp=lmGood(lm[LEFT_ELBOW])&&lmGood(lm[RIGHT_ELBOW]) &&
      lm[LEFT_ELBOW].y < ls.y && lm[RIGHT_ELBOW].y < rs.y;
    if(elbowsUp) return 'jump';
  }

  if(leftDelta < -threshold || rightDelta < -threshold) return 'left';
  if(leftDelta > threshold || rightDelta > threshold) return 'right';

  return 'center';
}

function onPose(result){
  if(!result.poseLandmarks)return;
  const lm=result.poseLandmarks;
  const dir=getPoseDirection(lm);
  if(!dir)return;

  // 빠르게 좌우를 번갈아 인식할 때 흔들림을 줄임
  const now=performance.now();
  if(controlCooldown>now)return;

  if(dir==='jump'){
    if(jumpCooldown<now && player.onGround && running){
      jump();
      jumpCooldown=now+650;
      statusEl.textContent='🙌 점프!';
    }
    return;
  }

  if(dir==='left' || dir==='right'){
    if(control!==dir){
      control=dir;
      movePlayer(dir);
      controlCooldown=now+180;
      statusEl.textContent=dir==='left'?'👈 왼쪽!':'👉 오른쪽!';
    }
  }else{
    control='center';
  }
}

async function setupPose(){
  pose=new Pose({
    locateFile:(file)=>`https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
  });
  pose.setOptions({
    modelComplexity:1,
    smoothLandmarks:true,
    enableSegmentation:false,
    smoothSegmentation:false,
    minDetectionConfidence:0.55,
    minTrackingConfidence:0.55
  });
  pose.onResults(onPose);
  poseReady=true;
  statusEl.textContent='카메라 준비 완료';
}

async function startCamera(){
  try{
    stream=await navigator.mediaDevices.getUserMedia({
      video:{
        facingMode:{ideal:'user'},
        width:{ideal:640},
        height:{ideal:480}
      },
      audio:false
    });
    video.srcObject=stream;
    await video.play();
    statusEl.textContent='사람을 비추는 중...';
    cameraLoop();
  }catch(e){
    console.error(e);
    statusEl.textContent='카메라 권한을 허용해주세요';
    alert('카메라를 사용할 수 없습니다. 브라우저의 카메라 권한을 허용하고 HTTPS 주소에서 다시 실행해주세요.');
  }
}

async function cameraLoop(){
  if(video.readyState>=2 && pose && !processing){
    processing=true;
    try{await pose.send({image:video});}catch(e){console.log(e);}
    processing=false;
  }
  requestAnimationFrame(cameraLoop);
}

function resetGame(){
  score=0;lives=3;obstacles=[];
  scoreEl.textContent=score;livesEl.textContent=lives;
  player.x=W/2;player.y=groundY()-player.h;player.vy=0;player.onGround=true;
  spawnTimer=0;control='center';controlCooldown=0;jumpCooldown=0;
  running=true;gameOver=false;lastTime=performance.now();
  gameoverEl.style.display='none';
  statusEl.textContent='🖐️ 손을 뻗어서 움직여!';
  requestAnimationFrame(gameLoop);
}

function groundY(){return H*0.78;}

function movePlayer(dir){
  if(!running)return;
  const amount=Math.max(75,W*0.10);
  if(dir==='left')player.x-=amount;
  if(dir==='right')player.x+=amount;
  player.x=Math.max(45,Math.min(W-45,player.x));
}

function jump(){
  if(!player.onGround)return;
  player.vy=-Math.max(650,H*0.9);
  player.onGround=false;
}

function spawnObstacle(){
  const size=Math.max(42,Math.min(68,W*0.07));
  obstacles.push({
    x:Math.random()*(W-size*1.5)+size*.75,
    y:groundY()-size,
    w:size,h:size,
    speed:Math.max(260,W*.38)
  });
}

function rectsOverlap(a,b){
  return a.x-a.w/2 < b.x+b.w &&
         a.x+a.w/2 > b.x &&
         a.y < b.y+b.h &&
         a.y+a.h > b.y;
}

function loseLife(){
  lives--;livesEl.textContent=lives;
  if(lives<=0)endGame();
}

function endGame(){
  running=false;gameOver=true;
  finalScoreEl.textContent=Math.floor(score);
  gameoverEl.style.display='flex';
}

function update(dt){
  player.vy+=1800*dt;
  player.y+=player.vy*dt;
  const gy=groundY()-player.h;
  if(player.y>=gy){
    player.y=gy;player.vy=0;player.onGround=true;
  }

  spawnTimer-=dt;
  if(spawnTimer<=0){
    spawnObstacle();
    spawnTimer=0.95+Math.random()*0.65;
  }

  for(const o of obstacles)o.y+=o.speed*dt;

  const pbox={x:player.x,y:player.y,w:player.w,h:player.h};
  for(let i=obstacles.length-1;i>=0;i--){
    const o=obstacles[i];
    if(rectsOverlap(pbox,o)){
      obstacles.splice(i,1);
      loseLife();
      statusEl.textContent='💥 장애물에 부딪혔어!';
      continue;
    }
    if(o.y>H+100){
      obstacles.splice(i,1);
      score+=10;
      scoreEl.textContent=Math.floor(score);
    }
  }
  score+=dt*2;
  scoreEl.textContent=Math.floor(score);
}

function draw(){
  ctx.clearRect(0,0,W,H);

  // 배경
  ctx.fillStyle='#fff';
  for(let i=0;i<7;i++){
    const x=(i*190-(score*0.4)%190);
    ctx.beginPath();ctx.arc(x,100+(i%2)*45,25,0,Math.PI*2);ctx.arc(x+30,100+(i%2)*45,32,0,Math.PI*2);ctx.arc(x+65,105+(i%2)*45,22,0,Math.PI*2);ctx.fill();
  }

  // 바닥
  ctx.fillStyle='#4d983e';
  ctx.fillRect(0,groundY(),W,H-groundY());
  ctx.fillStyle='#74c85b';
  ctx.fillRect(0,groundY(),W,8);

  // 플레이어
  ctx.save();
  ctx.translate(player.x,player.y);
  ctx.fillStyle='#2563eb';
  ctx.fillRect(-player.w/2,15,player.w,player.h-15);
  ctx.fillStyle='#ffd2a6';
  ctx.beginPath();ctx.arc(0,0,23,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#111';
  ctx.beginPath();ctx.arc(-8,-3,3,0,Math.PI*2);ctx.arc(8,-3,3,0,Math.PI*2);ctx.fill();
  ctx.restore();

  // 장애물
  for(const o of obstacles){
    ctx.fillStyle='#ef4444';
    ctx.fillRect(o.x,o.y,o.w,o.h);
    ctx.fillStyle='#991b1b';
    ctx.fillRect(o.x+8,o.y+8,o.w-16,8);
  }
}

function gameLoop(t){
  if(!running)return;
  const dt=Math.min((t-lastTime)/1000,0.033);
  lastTime=t;
  update(dt);draw();
  requestAnimationFrame(gameLoop);
}

startBtn.onclick=async()=>{
  startBtn.style.display='none';
  if(!poseReady)await setupPose();
  if(!stream)await startCamera();
  resetGame();
};

restartBtn.onclick=()=>resetGame();

// 키보드도 테스트용으로 지원
addEventListener('keydown',(e)=>{
  if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')movePlayer('left');
  if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')movePlayer('right');
  if(e.key==='ArrowUp'||e.code==='Space')jump();
});

draw();
</script>
</body>
</html>
